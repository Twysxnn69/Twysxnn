<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOVA PLAY — Корзина</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="cart.html">
    <header class="site-header" data-header></header>
    <main>
      <div class="container" data-cart-page>
        <h1 class="page-heading">Корзина</h1>
        <p class="page-subtext">Управляйте количеством и подтвердите покупку.</p>

        <ul class="cart-list" data-cart-list></ul>

        <div class="panel" style="margin-top:16px; display:flex; align-items:center; justify-content:space-between; flex-wrap: wrap; gap: 12px;">
          <div>
            <div class="muted">Итого:</div>
            <strong data-cart-total>0 ₽</strong>
          </div>
          <button class="btn btn-primary" data-open-checkout>Купить</button>
        </div>
      </div>
    </main>
    <footer class="footer" data-footer></footer>

    <div class="modal" data-modal>
      <div class="modal-content">
        <h3>Подтверждение покупки</h3>
        <p class="muted">Игры будут добавлены в вашу библиотеку сразу после оплаты.</p>
        <div style="display:flex; gap:10px;">
          <button class="btn btn-primary" data-confirm-buy>Подтвердить</button>
          <button class="btn btn-outline" data-close-modal>Отмена</button>
        </div>
      </div>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
