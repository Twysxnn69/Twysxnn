<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOVA PLAY — Главная</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="index.html">
    <header class="site-header" data-header></header>
    <main>
      <div class="container">
        <section class="hero">
          <h1>Откройте новые миры в цифровом магазине игр</h1>
          <p>Минималистичный, быстрый и удобный магазин: каталог, фильтры по жанрам, персональная корзина и моментальная покупка.</p>
          <div><a class="btn btn-primary" href="catalog.html">Перейти в каталог</a></div>
        </section>

        <h2 class="section-title">Рекомендуемые игры</h2>
        <section class="grid" data-featured></section>
      </div>
    </main>
    <footer class="footer" data-footer></footer>

    <div class="modal" data-modal>
      <div class="modal-content">
        <h3>Подтверждение покупки</h3>
        <p class="muted">Оформление доступно на странице корзины.</p>
        <button class="btn btn-outline" data-close-modal>Закрыть</button>
      </div>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
