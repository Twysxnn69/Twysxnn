<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOVA PLAY — Профиль</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="profile.html">
    <header class="site-header" data-header></header>
    <main>
      <div class="container" data-profile-page>
        <h1 class="page-heading">Профиль пользователя</h1>
        <p class="page-subtext">Ваша персональная статистика и игровая библиотека.</p>

        <section class="panel" style="max-width:540px;">
          <h2 style="margin-top:0;">Игрок: NightPilot</h2>
          <p class="muted">Уровень аккаунта: 18</p>
          <p class="muted">Игр в библиотеке: <strong data-owned-games>17</strong></p>
          <p class="muted">Любимые жанры: Action RPG, Strategy, Indie</p>
        </section>
      </div>
    </main>
    <footer class="footer" data-footer></footer>

    <div class="modal" data-modal>
      <div class="modal-content">
        <h3>Информация</h3>
        <p class="muted">На этой странице покупки не выполняются.</p>
        <button class="btn btn-outline" data-close-modal>Закрыть</button>
      </div>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
